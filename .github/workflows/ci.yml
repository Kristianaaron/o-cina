name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r backend/requirements.txt
      - name: Test
        run: cd backend && CUDA_VISIBLE_DEVICES='' python -m pytest tests/ -v --tb=short
      - name: Lint
        run: cd backend && python -m ruff check app/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: cd frontend && npm ci
      - name: Test
        run: cd frontend && npx vitest run --config vitest.config.js
      - name: Build
        run: cd frontend && npm run build
